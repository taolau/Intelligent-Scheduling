<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能排班系统</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📅</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #222; }
    #view { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <svg class="side-brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 3v4M16 3v4"/><path d="M8 14h3M13 14h3"/></svg>
      <span class="side-brand-text side-label">智能排班</span>
    </div>
    <nav id="nav" class="side-nav"></nav>
    <button type="button" class="side-toggle" title="收起/展开侧边栏">
      <svg class="chev chev-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <svg class="chev chev-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </aside>
  <main id="view"></main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
